<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Я тебя люблю, Полина ❤</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #2a0a2e 0%, #0d0210 100%);
    overflow: hidden;
    font-family: 'Georgia', serif;
    position: relative;
  }

  /* === ФРАЗА В ЦЕНТРЕ — ПОЯВЛЯЕТСЯ ПОЗЖЕ === */
  .center-text {
    position: relative;
    z-index: 10;
    font-size: clamp(1.3rem, 4vw, 2.6rem);
    color: #fff;
    text-align: center;
    text-shadow:
      0 0 10px #ff4d8d,
      0 0 20px #ff4d8d,
      0 0 40px #ff1e6e,
      0 0 80px #ff1e6e;
    padding: 0 20px;
    letter-spacing: 2px;
    line-height: 1.3;

    /* ⭐ Сначала невидима, появляется через 2.5 сек */
    opacity: 0;
    transform: translateY(40px);
    animation: textAppear 1.2s ease-out 1.6s forwards,
           pulse 2.5s ease-in-out 2.8s infinite;
  }

  /* Появление надписи — снизу вверх + проявление */
  @keyframes textAppear {
    from {
      opacity: 0;
      transform: translateY(40px);
      filter: blur(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  /* Имя Полина */
  .name {
    display: block;
    margin-top: 8px;
    font-size: 1.15em;
    font-style: italic;
    color: #fff;
    text-shadow:
      0 0 12px #ffffff,
      0 0 24px #ffb3d1,
      0 0 48px #ff1e6e,
      0 0 90px #ff1e6e;
  }

  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      text-shadow:
        0 0 10px #ff4d8d,
        0 0 20px #ff4d8d,
        0 0 40px #ff1e6e,
        0 0 80px #ff1e6e;
    }
    50% {
      transform: scale(1.06);
      text-shadow:
        0 0 20px #ff6ba3,
        0 0 40px #ff4d8d,
        0 0 60px #ff1e6e,
        0 0 120px #ff1e6e;
    }
  }

  /* === КРУГ ИЗ СЕРДЕЧЕК — ПОЯВЛЯЕТСЯ СНИЗУ === */
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 5;
    opacity: 0;
    transform: translateY(100vh) scale(0.4);
    /* ⭐ Вылетает снизу за 2 секунды */
    animation: ringAppear 2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }

  @keyframes ringAppear {
    0% {
      opacity: 0;
      transform: translateY(100vh) scale(0.4);
      filter: blur(6px);
    }
    60% {
      opacity: 1;
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  /* Внутренний контейнер, который вращается */
  .ring-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    animation: rotateRing linear infinite;
  }

  @keyframes rotateRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Каждое сердечко */
  .heart {
    position: absolute;
    top: 0;
    left: 0;
    color: #ffffff;
    text-shadow:
      0 0 8px #ffffff,
      0 0 16px #ffb3d1,
      0 0 24px #ff4d8d;
    transform-origin: center;
    animation: heartbeat 1.8s ease-in-out infinite;
    line-height: 1;
  }

  @keyframes heartbeat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.3); }
  }

  /* Плавающие сердечки на фоне */
  .floating-heart {
    position: absolute;
    color: #ffffff;
    opacity: 0.6;
    animation: floatUp linear infinite;
    text-shadow: 0 0 8px #ffb3d1;
    pointer-events: none;
    line-height: 1;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.5) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    90% { opacity: 0.5; }
    100% {
      transform: translateY(-10vh) scale(1) rotate(360deg);
      opacity: 0;
    }
  }

  /* Мерцающие звёздочки */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
    box-shadow: 0 0 6px #ffb3d1;
    pointer-events: none;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>

  <div class="ring" id="ring">
    <div class="ring-inner" id="ringInner"></div>
  </div>

  <div class="center-text">
    Я тебя люблю ❤
    <span class="name">Полина</span>
  </div>

<script>
  const ringInner = document.getElementById('ringInner');

  // ⭐ Создаём круг ТОЛЬКО ПОСЛЕ появления ring на экране
  function createRing() {
    const total = 48;
    const radius = 200;
    const rotationSpeed = 25;

    ringInner.style.animationDuration = rotationSpeed + 's';

    for (let i = 0; i < total; i++) {
      const angle = (360 / total) * i;
      const rad = (angle * Math.PI) / 180;

      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤';

      const x = Math.cos(rad) * radius;
      const y = Math.sin(rad) * radius;

      heart.style.left = x + 'px';
      heart.style.top = y + 'px';

      const size = 12 + Math.random() * 10;
      heart.style.fontSize = size + 'px';

      heart.style.animationDelay = (Math.random() * 2) + 's';

      ringInner.appendChild(heart);
    }
  }

  // Плавающие сердечки на фоне — стартуют сразу
  function createFloatingHearts() {
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (10 + Math.random() * 20) + 'px';
      const duration = 7 + Math.random() * 6;
      heart.style.animationDuration = duration + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), duration * 1000);
    }, 400);
  }

  // Мерцающие звёзды
  function createStars() {
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (1.5 + Math.random() * 3) + 's';
      star.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(star);
    }
  }

  createRing();
  createFloatingHearts();
  createStars();
</script>

</body>
</html>
